let userScore = 0;
const answeredQuestions = new Set();

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    quizData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const questionTitle = document.createElement('div');
        questionTitle.className = 'question-text';
        questionTitle.innerText = item.q;
        card.appendChild(questionTitle);

        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'options-container';

        item.options.forEach((opt, optIndex) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(index, optIndex, card);
            optionsContainer.appendChild(btn);
        });

        card.appendChild(optionsContainer);

        const feedback = document.createElement('div');
        feedback.id = `feedback-${index}`;
        feedback.className = 'feedback-box';
        card.appendChild(feedback);

        container.appendChild(card);
    });
}

function selectAnswer(questionIndex, selectedOptionIndex, cardElement) {
    if (answeredQuestions.has(questionIndex)) return;

    answeredQuestions.add(questionIndex);
    const data = quizData[questionIndex];
    const buttons = cardElement.querySelectorAll('.option-btn');
    const feedback = cardElement.querySelector('.feedback-box');

    buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === data.answer) {
            btn.classList.add('correct');
        } else if (idx === selectedOptionIndex) {
            btn.classList.add('incorrect');
        }
    });

    if (selectedOptionIndex === data.answer) {
        userScore++;
        document.getElementById('score').innerText = userScore;
        feedback.className = 'feedback-box show correct';
        feedback.innerHTML = `<strong>Correct!</strong><br>${data.explanation}`;
    } else {
        feedback.className = 'feedback-box show incorrect';
        feedback.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <em>${data.options[data.answer]}</em>.<br>${data.explanation}`;
    }
}

window.onload = renderQuiz;
</script>
