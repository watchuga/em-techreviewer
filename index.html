<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Reviewer - Sir J</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #030712 100%);
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --accent-purple: #c084fc;
      --accent-cyan: #22d3ee;
      --accent-amber: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --correct-color: #4ade80;
      --correct-bg: rgba(34, 197, 94, 0.18);
      --incorrect-color: #f87171;
      --incorrect-bg: rgba(239, 68, 68, 0.18);
      --shadow-glow: 0 10px 35px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 820px;
      padding: 22px 20px;
      text-align: center;
      box-shadow: var(--shadow-glow);
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      background: linear-gradient(90deg, #60a5fa, #c084fc, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* DASHBOARD */
    .dashboard {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      max-width: 820px;
      margin-bottom: 15px;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-glow);
    }

    .stat-icon {
      font-size: 1.3rem;
      color: var(--accent-cyan);
      background: rgba(34, 211, 238, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-data {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* PROGRESS BAR */
    .progress-container {
      width: 100%;
      max-width: 820px;
      background: rgba(15, 23, 42, 0.6);
      height: 8px;
      border-radius: 20px;
      margin-bottom: 20px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent-purple));
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    /* QUIZ CARD */
    .quiz-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 820px;
      padding: 30px;
      box-shadow: var(--shadow-glow);
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .quiz-card.slide-out {
      opacity: 0;
      transform: translateX(-20px);
    }

    .quiz-card.slide-in {
      animation: slideIn 0.3s forwards ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .question-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(192, 132, 252, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(192, 132, 252, 0.3);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    .question-text {
      font-size: 1.1rem;
      color: var(--text-main);
      line-height: 1.6;
      margin-bottom: 22px;
      font-weight: 600;
    }

    /* OPTIONS GRID */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: rgba(15, 23, 42, 0.5);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 18px;
      text-align: left;
      font-size: 0.95rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .option-btn:hover:not(.disabled) {
      border-color: var(--primary-hover);
      background: rgba(59, 130, 246, 0.12);
      transform: translateY(-2px);
    }

    .option-letter {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-weight: 800;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .option-btn:hover:not(.disabled) .option-letter {
      background: var(--primary);
      color: #fff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.22);
    }

    .option-btn.correct-reveal {
      border-color: var(--correct-color) !important;
      background-color: var(--correct-bg) !important;
      color: #ffffff !important;
    }

    .option-btn.correct-reveal .option-letter {
      background: var(--correct-color) !important;
      color: #000 !important;
    }

    .option-btn.incorrect-reveal {
      border-color: var(--incorrect-color) !important;
      background-color: var(--incorrect-bg) !important;
      color: #ffffff !important;
    }

    .option-btn.incorrect-reveal .option-letter {
      background: var(--incorrect-color) !important;
      color: #ffffff !important;
    }

    .option-btn.disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    /* CONTROLS & FEEDBACK */
    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-submit {
      background: linear-gradient(90deg, var(--primary), var(--accent-purple));
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
    }

    .btn-submit:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next {
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(192, 132, 252, 0.3);
    }

    .btn-next:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(34, 211, 238, 0.4);
    }

    .feedback-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .feedback-box.correct {
      background: var(--correct-bg);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: var(--correct-color);
    }

    .feedback-box.incorrect {
      background: var(--incorrect-bg);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--incorrect-color);
    }

    /* RESULTS CARD */
    .results-card {
      display: none;
      text-align: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 25px;
      box-shadow: var(--shadow-glow);
      width: 100%;
      max-width: 820px;
    }

    .trophy-badge {
      font-size: 3.5rem;
      color: var(--accent-amber);
      margin-bottom: 12px;
    }

    .results-score {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--accent-cyan), var(--correct-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 8px 0;
    }

    .results-message {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    @media (max-width: 600px) {
      .quiz-card { padding: 20px; }
      header h1 { font-size: 1.4rem; }
      .dashboard { gap: 6px; }
      .stat-card { padding: 8px 10px; gap: 8px; }
      .stat-icon { width: 32px; height: 32px; font-size: 0.95rem; }
      .stat-value { font-size: 0.95rem; }
      .btn { padding: 10px 18px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-microchip"></i> AI Systems Reviewer</h1>
    <p>-Sir J's Class</p>
  </header>

  <div class="dashboard">
    <div class="stat-card">
      <div class="stat-icon"><i class="fa-solid fa-list-check"></i></div>
      <div class="stat-data">
        <span class="stat-label">Progress</span>
        <span class="stat-value" id="progress-text">1 / 40</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fa-solid fa-star"></i></div>
      <div class="stat-data">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score-text">0</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fa-solid fa-bullseye"></i></div>
      <div class="stat-data">
        <span class="stat-label">Accuracy</span>
        <span class="stat-value" id="accuracy-text">0%</span>
      </div>
    </div>
  </div>

  <div class="progress-container">
    <div class="progress-fill" id="progress-bar"></div>
  </div>

  <div class="quiz-card" id="quiz-card">
    <div class="question-badge" id="question-badge">
      <i class="fa-solid fa-layer-group"></i> Question 1
    </div>
    
    <div class="question-text" id="question-text">Loading prompt...</div>

    <div class="options-grid" id="options-grid"></div>

    <div class="feedback-box" id="feedback-box"></div>

    <div class="controls">
      <button class="btn btn-submit" id="submit-btn" disabled onclick="checkAnswer()">
        <span>Lock In Answer</span>
        <i class="fa-solid fa-lock"></i>
      </button>
      <button class="btn btn-next" id="next-btn" style="display: none;" onclick="nextQuestion()">
        <span>Next Challenge</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <div class="results-card" id="results-card">
    <div class="trophy-badge">
      <i class="fa-solid fa-trophy"></i>
    </div>
    <h2>Reviewer Completed!</h2>
    <div class="results-score" id="final-score">0 / 40</div>
    <p class="results-message" id="final-message">Great effort working through the ICT & AI Systems reviewer!</p>
    <button class="btn btn-next" onclick="restartQuiz()">
      <i class="fa-solid fa-rotate-right"></i> Practice Again
    </button>
  </div>

  <script>
    // 40 PARAPHRASED & DISTRACTOR-ENHANCED QUESTIONS (SHUFFLED UPON INITIALIZATION)
    const rawQuestions = [
      {
        question: "How would you best define the primary scope of physical hardware maintenance?",
        options: [
          "Focusing exclusively on OS installation and software driver optimization.",
          "Systematic inspection, physical cleaning, component restoration, and physical upgrades of hardware.",
          "Monitoring internet connectivity bandwidth and network traffic routing.",
          "Managing word processing software and spreadsheet files."
        ],
        correct: 1,
        explanation: "Hardware maintenance encompasses hands-on physical upkeep, thermal component cleaning, diagnostic checks, and physical hardware servicing."
      },
      {
        question: "Which proactive strategy is specifically designed to eliminate hardware failures before they occur through scheduled routine care?",
        options: [
          "Corrective Maintenance",
          "Preventive Maintenance",
          "Reactive Maintenance",
          "Emergency Overhaul"
        ],
        correct: 1,
        explanation: "Preventive maintenance relies on scheduled cleaning, servicing, and routine checks to stop hardware issues before they happen."
      },
      {
        question: "An IT protocol uses active diagnostic monitoring software to analyze component wear and predict imminent mechanical breakdowns before failure. What strategy is this?",
        options: [
          "Preventive Maintenance",
          "Predictive Maintenance",
          "Corrective Maintenance",
          "Manual Servicing"
        ],
        correct: 1,
        explanation: "Predictive maintenance relies on real-time data sensor diagnostics and failure metrics to forecast when a part will break."
      },
      {
        question: "Which scenario below represents a direct implementation of corrective maintenance?",
        options: [
          "Blowing dust out of the cooling fins every three months.",
          "Swapping out a completely non-functional drive after it suffers a total mechanical failure.",
          "Patching system drivers during routine maintenance windows.",
          "Applying fresh thermal paste during yearly computer overhauls."
        ],
        correct: 1,
        explanation: "Corrective maintenance is reactive—it occurs strictly after a breakdown or component failure has occurred."
      },
      {
        question: "Among the following computer hardware components, which one functions primarily as an input device?",
        options: [
          "Dot Matrix Printer",
          "High-Definition Monitor",
          "Acoustic Speaker",
          "Mechanical Keyboard"
        ],
        correct: 3,
        explanation: "Keyboards feed user alphanumeric data into the system, making them core input peripherals."
      },
      {
        question: "Which professional infrastructure environment continuously tracks server telemetry and ambient conditions to maintain zero unplanned downtime?",
        options: [
          "Data Center",
          "Staff Lounge",
          "Public Reading Room",
          "Campus Grounds"
        ],
        correct: 0,
        explanation: "Data centers enforce strict real-time telemetry monitoring to guarantee uninterrupted uptime and server stability."
      },
      {
        question: "What is a major operational advantage gained from structured hardware maintenance?",
        options: [
          "Increased overall repair and replacement expenses.",
          "Unplanned drop in system processing speeds.",

          "Elevated frequency of emergency technical interventions."
        ],
        correct: 2,
        explanation: "Proper component care preserves internal hardware health, directly extending device service lifespan."
      },
      {
        question: "Which of the following presents a known obstacle or risk during physical hardware maintenance operations?",
        options: [
          "Gains in user productivity.",
          "Enhanced security posture.",
          "Component incompatibility between newly upgraded and existing system parts.",
          "Increased durability of thermal components."
        ],
        correct: 2,
        explanation: "Inter-device compatibility friction often arises when matching newer hardware upgrades with older legacy systems."
      },
      {
        question: "What is considered an industry-standard best practice during routine computer maintenance?",
        options: [
          "Ignoring minor fan noises or minor thermal warnings.",
          "Establishing and adhering to a structured inspection calendar.",
          "Skipping recommended BIOS/firmware patches.",
          "Disassembling complex high-voltage power components without technical knowledge."
        ],
        correct: 1,
        explanation: "A structured, regular maintenance schedule prevents minor oversights from turning into catastrophic component failures."
      },
      {
        question: "A automated telemetry system flags that a rack server's processor temperature is spiking abnormally high during idle mode, signaling risk prior to system failure. This relies on:",
        options: [
          "Predictive Maintenance",
          "Corrective Maintenance",
          "Emergency Intervention",
          "Ad-hoc Servicing"
        ],
        correct: 0,
        explanation: "By analyzing environmental metrics to preempt a breakdown before it happens, the facility utilizes predictive maintenance."
      },
      {
        question: "Which application scenario demonstrates genuine AI-driven recommendation functionality?",

          "A standard scientific calculator evaluating a fixed multiplication sequence.",
          "A digital watch reading its internal quartz timer.",

        correct: 2,

      },
      {
        question: "A radiological center uses an AI tool to highlight subtle cellular anomalies in diagnostic scans. What is the most accurate understanding of this technology's role?",
        options: [
          "The AI fully replaces medical doctors and diagnostic staff.",
          "Medical training becomes obsolete because the software acts independently.",
          "The AI guarantees 100% error-free medical assessments.",
          "The AI serves as a powerful diagnostic assistant to support clinical decision-making."
        ],
        correct: 3,
        explanation: "AI acts as a decision-support augment, enhancing human specialist capability rather than completely replacing human expertise."
      },
      {
        question: "An international traveler speaks a sentence in Tagalog, and a translation tool immediately outputs natural English audio. Which specific AI discipline enables this?",
        options: [
          "Computer Vision",

          "Autonomous Navigation",
          "Financial Anomaly Detection"
        ],
        correct: 1,

      },

        options: [

      {

      {

      {

      },
      {

        options: [
          "Because human language syntax is completely frozen and never evolves.",

      },
      {

        options: [

        correct: 1,

      {

        options: [

        correct: 0,

      {

      {

          "An outdated web development programming language.",

        explanation: "Deep Learning uses artificial neural network architectures with many deep layers to model complex data representations."

      {

        correct: 1,
        explanation: "Computer Vision algorithms enable machines to analyze visual information from optical inputs like photos and video feeds."

      {
        question: "A traffic camera scans live video and draws labeled bounding boxes around vehicles, pedestrians, and cyclists. What specific task is occurring?",

      {

      {

        options: [
          "Sentiment Analysis (NLP)",
          "Visual Object Recognition",
          "Biometric Facial Mapping",

    // UTILITY: Fisher-Yates Array Shuffle Engine
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Prepare dynamic shuffled quiz dataset
    let quizData = shuffleArray([...rawQuestions]).map((item, index) => {
      // Shuffle options while tracking the correct answer index
      const originalCorrectOption = item.options[item.correct];
      const shuffledOptions = shuffleArray([...item.options]);
      const newCorrectIndex = shuffledOptions.indexOf(originalCorrectOption);

      return {
        id: index + 1,
        question: item.question,
        options: shuffledOptions,
        correct: newCorrectIndex,
        explanation: item.explanation
      };
    });

    let currentIndex = 0;
    let selectedOption = null;
    let score = 0;
    let answeredCount = 0;

    // DOM Elements
    const quizCard = document.getElementById('quiz-card');
    const questionText = document.getElementById('question-text');
    const optionsGrid = document.getElementById('options-grid');
    const questionBadge = document.getElementById('question-badge');
    const submitBtn = document.getElementById('submit-btn');
    const nextBtn = document.getElementById('next-btn');
    const feedbackBox = document.getElementById('feedback-box');
    const progressText = document.getElementById('progress-text');
    const scoreText = document.getElementById('score-text');
    const accuracyText = document.getElementById('accuracy-text');
    const progressBar = document.getElementById('progress-bar');
    const resultsCard = document.getElementById('results-card');

    function loadQuestion() {
      const q = quizData[currentIndex];
      selectedOption = null;

      quizCard.classList.remove('slide-out');
      quizCard.classList.add('slide-in');

      questionBadge.innerHTML = `<i class="fa-solid fa-layer-group"></i> Question ${q.id} of ${quizData.length}`;
      questionText.innerHTML = q.question;

      optionsGrid.innerHTML = '';
      feedbackBox.style.display = 'none';
      submitBtn.style.display = 'inline-flex';
      submitBtn.disabled = true;
      nextBtn.style.display = 'none';

      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((optText, idx) => {
        const optionBtn = document.createElement('div');
        optionBtn.className = 'option-btn';
        optionBtn.innerHTML = `
          <span class="option-letter">${letters[idx]}</span>
          <span style="flex-grow:1; line-height:1.4;">${optText}</span>
        `;
        optionBtn.onclick = () => selectOption(idx, optionBtn);
        optionsGrid.appendChild(optionBtn);
      });

      updateStatsUI();
    }

    function selectOption(index, element) {
      if (submitBtn.style.display === 'none') return;
      
      selectedOption = index;
      const allOptions = optionsGrid.querySelectorAll('.option-btn');
      allOptions.forEach(opt => opt.classList.remove('selected'));
      element.classList.add('selected');
      
      submitBtn.disabled = false;
    }

    function checkAnswer() {
      if (selectedOption === null) return;

      const q = quizData[currentIndex];
      const options = optionsGrid.querySelectorAll('.option-btn');

      options.forEach(opt => opt.classList.add('disabled'));
      answeredCount++;

      if (selectedOption === q.correct) {
        score++;
        options[selectedOption].classList.add('correct-reveal');
        feedbackBox.className = 'feedback-box correct';
        feedbackBox.innerHTML = `<strong><i class="fa-solid fa-circle-check"></i> Correct Choice!</strong><br>💡 <strong>Pedagogical Rationale:</strong> ${q.explanation}`;
        
        confetti({
          particleCount: 40,
          spread: 60,
          origin: { y: 0.8 }
        });
      } else {
        options[selectedOption].classList.add('incorrect-reveal');
        options[q.correct].classList.add('correct-reveal');
        feedbackBox.className = 'feedback-box incorrect';
        feedbackBox.innerHTML = `<strong><i class="fa-solid fa-circle-xmark"></i> Incorrect Selection.</strong><br>💡 <strong>Pedagogical Rationale:</strong> ${q.explanation}`;
      }

      feedbackBox.style.display = 'block';
      submitBtn.style.display = 'none';
      nextBtn.style.display = 'inline-flex';

      updateStatsUI();
    }

    function nextQuestion() {
      quizCard.classList.remove('slide-in');
      quizCard.classList.add('slide-out');

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < quizData.length) {
          loadQuestion();
        } else {
          showResults();
        }
      }, 250);
    }

    function updateStatsUI() {
      progressText.textContent = `${currentIndex + 1} / ${quizData.length}`;
      scoreText.textContent = score;
      const accuracy = answeredCount > 0 ? Math.round((score / answeredCount) * 100) : 0;
      accuracyText.textContent = `${accuracy}%`;

      const progressPercent = ((currentIndex + 1) / quizData.length) * 100;
      progressBar.style.width = `${progressPercent}%`;
    }

    function showResults() {
      quizCard.style.display = 'none';
      resultsCard.style.display = 'block';

      document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;

      const pct = (score / quizData.length) * 100;
      let msg = "";
      if (pct === 100) msg = "🌟 Exceptional Performance! You demonstrated complete mastery across all ICT and AI domains.";
      else if (pct >= 80) msg = "🎉 Great Work! You have a strong, robust understanding of hardware maintenance and AI systems.";
      else if (pct >= 60) msg = "👍 Good Effort! Review the rationale cards to solidify your understanding of tricky concepts.";
      else msg = "📚 Keep Reviewing! Brush up on core AI paradigms and hardware strategies, then try again.";

      document.getElementById('final-message').textContent = msg;

      if (pct >= 70) {
        confetti({
          particleCount: 120,
          spread: 90,
          origin: { y: 0.6 }
        });
      }
    }

    function restartQuiz() {
      // Reshuffle questions and choices on restart
      quizData = shuffleArray([...rawQuestions]).map((item, index) => {
        const originalCorrectOption = item.options[item.correct];
        const shuffledOptions = shuffleArray([...item.options]);
        const newCorrectIndex = shuffledOptions.indexOf(originalCorrectOption);

        return {
          id: index + 1,
          question: item.question,
          options: shuffledOptions,
          correct: newCorrectIndex,
          explanation: item.explanation
        };
      });

      currentIndex = 0;
      score = 0;
      answeredCount = 0;
      resultsCard.style.display = 'none';
      quizCard.style.display = 'block';
      loadQuestion();
    }

    window.onload = loadQuestion;
  </script>
